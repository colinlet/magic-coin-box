<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="analytics.js"></script>
    <title>奇妙金币盒 - 周末出游盲盒</title>
    <!-- 引入 canvas-confetti 撒花效果 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- 引入二维数据 -->
    <script src="mystery_box_data.js"></script>
    <style>
        body {
            font-family: 'Comic Sans MS', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #FFF9C4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* 视图容器，用于切换 */
        .view-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        h1 {
            color: #FF5722;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
            text-align: center;
        }

        /* === Step 1: 选城市视图样式 === */
        .city-cards-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
            padding: 20px;
        }

        .city-card {
            background: white;
            padding: 30px 40px;
            border-radius: 20px;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #333;
            border-bottom: 5px solid transparent; /* 为动态颜色留位置 */
        }

        .city-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 15px 25px rgba(0,0,0,0.15);
        }

        .city-card:active {
            transform: translateY(2px) scale(0.98);
        }


        /* === Step 2: 盲盒视图样式 (沿用原版) === */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            font-size: 1.2rem;
            background-color: white;
            color: #666;
            border: 2px solid #ddd;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 10;
        }
        .back-btn:hover { background-color: #f0f0f0; color: #333; }

        .box-container {
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .box-container:active {
            transform: scale(0.95);
        }

        .box {
            font-size: 8rem;
            user-select: none;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2));
            transition: all 0.3s;
        }

        /* 摇晃动画 */
        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-15deg) scale(1.1); }
            50% { transform: rotate(15deg) scale(1.1); }
            75% { transform: rotate(-15deg) scale(1.1); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .shaking {
            animation: shake 0.4s infinite;
        }

        /* 抽奖结果卡片 */
        .result-card {
            display: none;
            background: white;
            border-radius: 20px;
            padding: 40px 60px;
            text-align: center;
            box-shadow: 0 15px 25px rgba(0,0,0,0.15);
            transform: scale(0.1);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .result-card.show {
            display: block;
            transform: scale(1);
            opacity: 1;
        }

        .result-icon {
            font-size: 6rem;
            margin-bottom: 10px;
        }

        .result-name {
            font-size: 2.5rem;
            font-weight: bold;
            color: #333;
        }

        .btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 1.5rem;
            background-color: #FF5722;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 87, 34, 0.4);
            transition: background-color 0.3s, transform 0.2s;
            outline: none;
        }

        .btn:hover {
            background-color: #E64A19;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 5px rgba(255, 87, 34, 0.4);
        }
    </style>
</head>
<body>

    <!-- ==================== Step 1: 选城市 ==================== -->
    <div id="step-choose-city" class="view-section">
        <!-- 语言切换 -->
        <div style="position: absolute; top: 20px; right: 20px; z-index: 10;">
            <a href="mystery_box_en.html" style="text-decoration: none; color: #666; background: white; padding: 5px 15px; border-radius: 20px; border: 2px solid #ddd; font-size: 0.9rem;">🌐 English</a>
        </div>
        
        <h1>🌍 第一步：选择出游范围 🌍</h1>
        <div class="city-cards-container" id="city-cards-container">
            <!-- JS 动态渲染城市卡片 -->
        </div>
    </div>


    <!-- ==================== Step 2: 开盲盒 ==================== -->
    <div id="step-open-box" class="view-section" style="display: none;">
        <!-- 返回上一步按钮 -->
        <button class="back-btn" onclick="goBackToCities()">⬅️ 重选范围</button>

        <h1 id="title">👑 奇妙金币盒：周末出游盲盒 👑</h1>

        <div class="box-container" id="box-container" onclick="openBox()">
            <div class="box" id="box">🎁</div>
        </div>
        
        <button class="btn" id="start-btn" onclick="openBox()">点击开启盲盒</button>

        <div class="result-card" id="result-card">
            <div class="result-icon" id="result-icon">✨</div>
            <div class="result-name" id="result-name">目的地</div>
            <button class="btn" style="margin-top: 30px; background-color: #4CAF50; box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);" onclick="resetBox()">再抽一次</button>
        </div>
    </div>


    <script>
        // 初始化音频特效 (使用在线素材)
        const clickSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3');
        const magicSound = new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3'); // 魔法悬念声
        const tadaSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3');
        magicSound.volume = 0.5;

        // 全局变量，存放当前选中的一维地点列表
        let currentCityLocations = [];
        let isOpening = false;

        // --- 页面加载：渲染城市卡片 ---
        window.onload = function() {
            const container = document.getElementById('city-cards-container');
            
            // 遍历 mysteryBoxData (二维数据)
            mysteryBoxData.forEach((cityObj, index) => {
                let card = document.createElement('div');
                card.className = 'city-card';
                card.innerText = cityObj.cityName;
                card.style.borderBottomColor = cityObj.color || '#FF5722'; // 动态主题色
                
                // 绑定点击事件：传入索引
                card.onclick = () => selectCity(index); 
                container.appendChild(card);
            });
        }

        // --- 交互：选择了某个城市 ---
        function selectCity(cityIndex) {
            // 播放音效
            clickSound.currentTime = 0;
            clickSound.play().catch(e => {});

            // 1. 提取该城市的一维地点列表
            currentCityLocations = mysteryBoxData[cityIndex].locations;
            const cityName = mysteryBoxData[cityIndex].cityName;

            // 2. 切换视图
            document.getElementById('step-choose-city').style.display = 'none';
            document.getElementById('step-open-box').style.display = 'flex';
            
            // 3. 重置盲盒状态，更新副标题
            resetBox();
            document.getElementById('title').innerText = `🎁 盲盒已准备：${cityName} 🎁`;
        }

        // --- 交互：返回重选 ---
        function goBackToCities() {
            clickSound.currentTime = 0;
            clickSound.play().catch(e => {});

            document.getElementById('step-open-box').style.display = 'none';
            document.getElementById('step-choose-city').style.display = 'flex';
            
            // 重置状态
            resetBox();
            tadaSound.pause();
        }

        // --- 抽奖逻辑 ---
        function openBox() {
            if (isOpening || currentCityLocations.length === 0) return;
            isOpening = true;

            // 播放音效
            clickSound.currentTime = 0;
            clickSound.play().catch(e => {});
            magicSound.currentTime = 0;
            magicSound.play().catch(e => {});

            const boxContainer = document.getElementById('box-container');
            const box = document.getElementById('box');
            const btn = document.getElementById('start-btn');
            const title = document.getElementById('title');

            btn.style.display = 'none';
            title.innerText = "抽取中...";
            
            // 摇晃动画
            box.classList.add('shaking');

            // 模拟抽取等待 2 秒
            setTimeout(() => {
                box.classList.remove('shaking');
                boxContainer.style.display = 'none';
                showResult();
            }, 2000);
        }

        function showResult() {
            magicSound.pause();
            tadaSound.currentTime = 0;
            tadaSound.play().catch(e => {});

            // 【关键修改】从选定城市的一维数组中随机抽取
            const randomIndex = Math.floor(Math.random() * currentCityLocations.length);
            const result = currentCityLocations[randomIndex];

            const resultCard = document.getElementById('result-card');
            const resultIcon = document.getElementById('result-icon');
            const resultName = document.getElementById('result-name');
            const title = document.getElementById('title');

            title.innerText = "🎉 恭喜！本周末去这里玩 🎉";
            resultIcon.innerText = result.icon;
            resultName.innerText = result.name;
            resultName.style.color = result.color || '#333';

            resultCard.classList.add('show');
            shootConfetti(); // 撒花
        }

        function resetBox() {
            isOpening = false;
            
            document.getElementById('result-card').classList.remove('show');
            document.getElementById('box-container').style.display = 'block';
            document.getElementById('start-btn').style.display = 'block';
            document.getElementById('title').innerText = "👑 奇妙金币盒：周末出游盲盒 👑";
        }

        // --- 第三方撒花特效库调用 ---
        function shootConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);

                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount,
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
                }));
                confetti(Object.assign({}, defaults, { particleCount,
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
                }));
            }, 250);
        }
    </script>

    <!-- 联系与反馈 -->
    <div style="position: absolute; bottom: 15px; width: 100%; text-align: center; color: #aaa; font-size: 12px; z-index: 10;">

</body>
</html>
